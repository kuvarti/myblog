<!DOCTYPE html>
<html lang="en">

<head>
	<script>
		(function () {
			try {
				var t = localStorage.getItem('theme');
				if (t !== 'light' && t !== 'dark') {
					t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		})();
	</script>
	<script>
		// Companion to public/404.html: the GitHub Pages SPA fallback redirects
		// deep links to "/?/real/path"; restore the real path via history before
		// Vue Router reads window.location, so bookmarks and refreshes resolve.
		(function (l) {
			if (l.search[1] === '/') {
				var decoded = l.search.slice(1).split('&').map(function (s) {
					return s.replace(/~and~/g, '&');
				}).join('?');
				window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
			}
		})(window.location);
	</script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="/favicon.svg">
	<title>Ahmet Eryilmaz</title>
	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>

</body>

</html>
